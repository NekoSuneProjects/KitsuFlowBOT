<!doctype html><html><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><style>html,body{margin:0;background:transparent;font:700 30px system-ui;color:#fff;text-shadow:0 3px 10px #100624}#app{display:flex;flex-direction:column;gap:10px;padding:24px}.row{background:linear-gradient(120deg,#211344d9,#5e32bacc);border:1px solid #ac8bff;border-radius:14px;padding:14px 20px;max-width:700px}.meta{font-size:16px;color:#e2d4ff}</style></head><body><div id="app"></div><script>
const key=location.pathname.split('/').pop(),root=document.querySelector('#app');let previous=0;
async function update(){try{const r=await fetch('/api/overlay/'+encodeURIComponent(key),{cache:'no-store'});if(!r.ok)return;const x=await r.json();const items=x.kind==='leaderboard'?x.leaders.map((v,i)=>'#'+(i+1)+' '+v.username+' — '+v.points+' points'):x.kind==='queue'?x.queue.map((v,i)=>(i+1)+'. '+v.username):x.events.map(v=>v.message);root.replaceChildren();for(const value of items.slice(0,10)){const e=document.createElement('div');e.className='row';e.textContent=value;root.append(e)}}catch(e){console.error(e)}}
update();setInterval(update,5000);
</script></body></html>
