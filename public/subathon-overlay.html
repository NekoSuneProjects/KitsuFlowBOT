<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KitsuFlow Subathon OBS Overlay</title><style>
html,body{margin:0;min-height:100%;background:transparent;color:white;font:700 16px Inter,Arial,sans-serif}*{box-sizing:border-box}
#wrap{width:min(96vw,980px);margin:16px auto;padding:24px 35px;text-align:center;border-radius:24px;background:#1e1430;border:2px solid #b975f7;box-shadow:0 18px 50px #0006}
#title{font-size:clamp(20px,3vw,36px);letter-spacing:.17em;text-transform:uppercase;opacity:.94}
#clock{font-variant-numeric:tabular-nums;line-height:1.15;font-size:clamp(52px,9vw,122px);letter-spacing:.045em;text-shadow:0 5px 22px #0007}
#status{font-size:clamp(14px,2vw,23px);opacity:.9}
#events{margin-top:12px;font-size:clamp(13px,1.8vw,20px);font-weight:500;opacity:.85}
</style></head><body><main id="wrap"><div id="title">SUBATHON</div><div id="clock">00:00:00</div><div id="status">Waiting for timer...</div><div id="events"></div></main><script>
(function(){'use strict';
const key=encodeURIComponent(location.pathname.split('/').pop()),wrap=document.getElementById('wrap'),clock=document.getElementById('clock'),status=document.getElementById('status'),title=document.getElementById('title'),events=document.getElementById('events');
let data=null,at=Date.now(),lastHistory=null;
function format(ms){const n=Math.ceil(Math.max(0,ms)/1000),h=Math.floor(n/3600),m=Math.floor(n%3600/60),s=n%60;return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
function paint(){if(!data)return;const ms=Math.max(0,data.remaining_ms-(data.running?Date.now()-at:0));clock.textContent=format(ms);status.textContent=data.running&&ms>0?'● LIVE SUBATHON':ms===0?'TIMER ENDED':'Ⅱ PAUSED'}
async function refresh(){try{const response=await fetch('/api/subathon/public/'+key,{cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);data=await response.json();at=Date.now();wrap.style.background=data.transparent?'transparent':data.background;wrap.style.borderColor=data.accent;wrap.style.color=data.text_color;document.body.style.fontFamily=data.font+',Arial,sans-serif';title.textContent=data.title;clock.style.color=data.accent;events.style.display=data.show_events?'block':'none';const ev=data.last_event;events.textContent=ev?ev.platform.toUpperCase()+' · '+ev.event_type.replaceAll('_',' ')+' · +'+ev.seconds+'s':'';paint()}catch(err){status.textContent='Timer temporarily unavailable'}}
setInterval(paint,200);setInterval(refresh,2000);refresh();
})();</script></body></html>
