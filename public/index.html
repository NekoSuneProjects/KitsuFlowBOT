<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KitsuFlowBOT — Studio</title><style>
:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#0d0a19;color:#eee9ff}*{box-sizing:border-box}body{margin:0}button,a.button{background:#743be8;color:white;border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}button:disabled{opacity:.4;cursor:not-allowed}input,select{background:#181329;color:#eee;border:1px solid #46365f;border-radius:9px;padding:11px;max-width:100%}label{display:block;margin:12px 0}header{background:#171126;padding:18px 26px;border-bottom:1px solid #35264d;display:flex;justify-content:space-between;align-items:center}h1{margin:0;color:#ba9dff}h2{margin-top:0}main{max-width:1180px;margin:auto;padding:28px;display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:18px}.panel{background:#19132b;border:1px solid #382954;border-radius:16px;padding:24px;min-width:0}.wide{grid-column:1/-1}.muted{color:#a99abc}.item{border-bottom:1px solid #342749;padding:12px 0}small{color:#a99abc}#message{padding:16px;color:#b7f8c5}#voice{background:#292038}.error{color:#ff91ab}a{color:#c5a8ff}form{display:flex;gap:10px;flex-wrap:wrap;align-items:center}form input{flex:1;min-width:120px}
</style></head><body><header><h1>◈ KitsuFlowBOT</h1><span>KitsuFlowBOT Studio · Twitch Control Centre</span></header><div id="message"></div><main id="root"><section class="panel wide"><h2>Welcome to KitsuFlowBOT</h2><p>Sign in with your Twitch broadcaster account to connect your channel and manage your bot.</p><a class="button" href="/auth/connect/streamer">Connect with Twitch</a></section></main><script>
const root=document.querySelector('#root'),msg=document.querySelector('#message');let state;
async function request(url,method='GET',body){const r=await fetch(url,{method,headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j}
function alertText(s){msg.textContent=s}
function el(tag,text){const e=document.createElement(tag);e.textContent=text;return e}
async function reload(){try{state=await request('/api/state');render()}catch(e){if(!e.message.includes('Login required'))alertText(e.message)}}
function panel(title){const p=el('section','');p.className='panel';p.append(el('h2',title));root.append(p);return p}
function button(parent,text,fn){const b=el('button',text);parent.append(b);b.onclick=async()=>{b.disabled=true;try{await fn();await reload()}catch(e){alertText(e.message)}finally{b.disabled=false}};return b}
function render(){root.replaceChildren();const c=state.channel,b=state.bot;
let p=panel('Connections');p.append(el('p','Broadcaster: '+c.login));p.append(el('p','KitsuFlowBOT: '+(b?'@'+b.login:'not connected')));
if(!b){p.append(el('p','The shared KitsuFlowBOT has not yet been connected by the KitsuFlowBOT operator.'));if(state.isOperator){const a=el('a','Connect global bot account');a.href='/auth/connect/bot';a.className='button';p.append(a)}}
else{p.append(el('p','To enable bans and timeouts, add @'+b.login+' as a Twitch moderator using /mod '+b.login+' in your Twitch chat.'));p.append(el('small','Bot connection alone does not grant channel moderator privileges.'))}
p.append(el('p','Each streamer controls only their own channel and commands. One shared bot account serves every enabled Twitch channel.'));p=panel('Channel settings');let links=document.createElement('input');links.type='checkbox';links.checked=!!c.links;let enabled=document.createElement('input');enabled.type='checkbox';enabled.checked=!!c.enabled;p.append(el('label','Bot enabled'),enabled,el('label','Timeout unapproved URL messages'),links);button(p,'Save settings',()=>request('/api/settings','POST',{enabled:enabled.checked,links:links.checked}));button(p,'Disconnect my channel',async()=>{if(!confirm('Remove your Twitch authorisation and disable KitsuFlowBOT in this channel?'))return;await request('/api/channel/disconnect','POST');window.location.href='/'});
p=panel('Voice clipping');p.append(el('p','Say "clip it" to create a Twitch clip. Uses your microphone only after you start listening. Keep this dashboard open.'));const v=el('div','Voice recognition stopped');p.append(v);const sr=window.SpeechRecognition||window.webkitSpeechRecognition;if(sr){let rec,active=false;button(p,'Start / stop voice listening',async()=>{if(active){active=false;rec.stop();v.textContent='Stopped';return}rec=new sr();rec.continuous=true;rec.interimResults=false;active=true;rec.onresult=async e=>{for(let i=e.resultIndex;i<e.results.length;i++){const phrase=e.results[i][0].transcript.toLowerCase().trim();v.textContent='Heard: '+phrase;if(/\bclip it\b/.test(phrase)){try{const x=await request('/api/clip','POST');v.textContent='Clip created: '+x.id}catch(err){v.textContent=err.message}}}};rec.onend=()=>{if(active)rec.start()};rec.onerror=e=>{v.textContent=e.error;if(e.error==='not-allowed')active=false};rec.start();v.textContent='Listening for "clip it"'});}else p.append(el('p','This browser has no SpeechRecognition API; use a supported Chromium-based browser for this initial voice feature.'));
button(p,'Create clip now',async()=>{const x=await request('/api/clip','POST');alertText('Clip created: https://clips.twitch.tv/'+x.id)});
p=panel('Moderator tools');const f=el('form',''),target=document.createElement('input'),duration=document.createElement('input'),mode=document.createElement('select');target.placeholder='Twitch username';duration.type='number';duration.value='600';for(const x of ['timeout','ban']){const o=el('option',x);o.value=x;mode.append(o)}const submit=el('button','Apply moderation');f.append(target,mode,duration,submit);f.onsubmit=async e=>{e.preventDefault();if(!confirm('Apply '+mode.value+' to '+target.value+'?'))return;try{await request('/api/moderate','POST',{user:target.value,action:mode.value,seconds:Number(duration.value)});alertText('Moderation applied');await reload()}catch(err){alertText(err.message)}};p.append(f);
p=panel('Custom commands');const form=el('form',''),name=document.createElement('input'),response=document.createElement('input'),cool=document.createElement('input'),level=document.createElement('select');name.placeholder='command name';response.placeholder='Response (supports {user}, {channel}, {args})';cool.type='number';cool.value=10;cool.title='Cooldown seconds';for(const x of ['everyone','subscriber','moderator']){const o=el('option',x);o.value=x;level.append(o)}form.append(name,response,cool,level,el('button','Save command'));form.onsubmit=async e=>{e.preventDefault();try{await request('/api/commands','POST',{name:name.value,response:response.value,cooldown:Number(cool.value),level:level.value});await reload();alertText('Command saved')}catch(err){alertText(err.message)}};p.append(form);for(const x of state.commands){const row=el('div','!'+x.name+' — '+x.response+' ('+x.level+') ');row.className='item';button(row,'Delete',()=>request('/api/commands/'+encodeURIComponent(x.name),'DELETE'));p.append(row)}
p=panel('Recent events');for(const x of state.logs)p.append(el('div',x.created+' · '+x.event+' · '+x.detail));if(!state.logs.length)p.append(el('p','No events yet'));
}
reload();
</script><script src="/engagement.js" defer></script><script src="/creator.js" defer></script><script src="/access-ui.js" defer></script></body></html>
