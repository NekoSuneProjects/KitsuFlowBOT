<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KitsuFlow Stream Boss</title><style>
*{box-sizing:border-box}body{margin:0;background:transparent;font:600 20px Inter,Arial,sans-serif;color:#fff}.boss{margin:12px;max-width:800px;border:2px solid var(--accent,#ad73f7);background:var(--bg,#17151e);padding:20px;border-radius:18px;box-shadow:0 8px 28px #0006}h2{font-size:16px;letter-spacing:.15em;margin:0 0 12px}.name{font-size:29px;font-weight:800}.meta{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.hp{height:24px;background:#ffffff24;border-radius:18px;overflow:hidden}.fill{height:100%;width:100%;background:linear-gradient(90deg,var(--accent,#ad73f7),#e3acff);transition:width .55s}.values{text-align:right;font-size:15px;margin-top:7px;font-variant-numeric:tabular-nums}.hidden{display:none}
</style></head><body><main id="boss" class="boss hidden"><h2 id="title">STREAM BOSS</h2><div class="meta"><span id="name" class="name">Stream Boss</span><span id="wins"></span></div><div class="hp"><div id="fill" class="fill"></div></div><div id="values" class="values">5000 / 5000 HP</div></main><script>
'use strict';const key=encodeURIComponent(location.pathname.split('/').pop());
async function tick(){try{const r=await fetch('/api/stream-boss/public/'+key,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const s=await r.json();const b=document.getElementById('boss');b.classList.toggle('hidden',!s.enabled);b.style.setProperty('--accent',s.accent);b.style.setProperty('--bg',s.transparent?'transparent':s.background);b.style.color=s.text_color;document.getElementById('title').textContent=s.title;document.getElementById('name').textContent=s.name;document.getElementById('wins').textContent='👑 '+s.wins;document.getElementById('fill').style.width=(100*s.hp/Math.max(1,s.max_hp))+'%';document.getElementById('values').textContent=s.hp.toLocaleString()+' / '+s.max_hp.toLocaleString()+' HP'}catch(e){console.warn('Stream Boss unavailable',e.message)}}
tick();setInterval(tick,2000);
</script></body></html>
