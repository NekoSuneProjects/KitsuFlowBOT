<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KitsuFlow Stream Alerts</title><style>
*{box-sizing:border-box}html,body{margin:0;background:transparent;color:#fff;font:600 20px Inter,Arial,sans-serif}.toast{position:absolute;left:24px;bottom:24px;width:min(540px,calc(100vw - 48px));padding:22px 30px;border:2px solid var(--accent,#a879f7);border-radius:20px;background:var(--bg,#1a1430);box-shadow:0 12px 45px #0007;transform:translateY(130%);opacity:0;transition:transform .4s,opacity .4s}.toast.show{transform:translateY(0);opacity:1}.heading{font-size:12px;letter-spacing:.19em;text-transform:uppercase;opacity:.75}.headline{font-weight:800;font-size:32px;margin:8px 0}.details{font-size:16px;opacity:.9}.platform{font-size:14px;color:var(--accent,#a879f7);text-transform:uppercase}</style></head><body><main id="alert" class="toast"><div class="heading" id="title">STREAM ALERTS</div><div class="headline" id="headline"></div><div class="details"><span id="platform" class="platform"></span> · <span id="details"></span></div></main><script>
'use strict';const key=encodeURIComponent(location.pathname.split('/').pop());let after=null,busy=false,settings=null;const queue=[];
const label={follow:'just followed!',subscription:'just subscribed!',subscription_renewal:'resubscribed!',subscription_gift:'gifted subscriptions!',cheer:'cheered Bits!',kicks:'sent Kicks!',raid:'raided the stream!',donation:'sent a donation!',membership:'became a member!',membership_update:'updated their membership!',membership_end:'membership ended',purchase:'made a purchase!'};
const box=document.getElementById('alert');
function play(){if(busy||!queue.length)return;busy=true;const e=queue.shift();box.style.setProperty('--accent',settings.accent);box.style.setProperty('--bg',settings.transparent?'transparent':settings.background);box.style.color=settings.text_color;document.getElementById('title').textContent=settings.title;document.getElementById('headline').textContent=(e.actor||'A supporter')+' '+(label[e.event_type]||e.event_type);document.getElementById('platform').textContent=e.platform;document.getElementById('details').textContent=settings.show_amount?e.detail||e.event_type:e.event_type;box.classList.add('show');setTimeout(()=>{box.classList.remove('show');setTimeout(()=>{busy=false;play()},450)},settings.duration_ms)}
async function poll(){try{const r=await fetch('/api/stream-alerts/public/'+key+'?after='+(after??0),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();settings=d;if(after===null){after=d.latest;return}for(const e of d.events||[])if(e.id>after){after=e.id;if(queue.length<30)queue.push(e)}after=Math.max(after,d.events?.length?d.events[d.events.length-1].id:after);play()}catch(e){console.warn('Alert feed unavailable',e.message)}}
poll();setInterval(poll,1400);
</script></body></html>
