<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>KitsuFlow Multi Chat</title><style>
html,body{margin:0;background:transparent;color:#fff;font:16px/1.45 system-ui,Arial,sans-serif;overflow:hidden} #connection-status{display:flex;gap:8px;flex-wrap:wrap;padding:9px 12px} .connection{font-size:12px;font-weight:650;padding:5px 10px;border-radius:8px;background:rgba(20,24,35,.9)} .light{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:#e5a12f} .connected .light{background:#34c76a} .pending .light{background:#e5a12f} .failed .light{background:#eb4956} #feed{height:calc(100vh - 45px);box-sizing:border-box;display:flex;flex-direction:column;justify-content:flex-end;gap:7px;padding:12px}.message{padding:8px 12px;border-radius:10px;background:rgba(12,16,27,.86);box-shadow:0 2px 12px #0003;word-break:break-word}.platform{font-size:11px;font-weight:bold;letter-spacing:.06em;padding:3px 5px;border-radius:4px;margin-right:7px;background:#444}.twitch{background:#6441a5}.kick{background:#168c38}.vpzone{background:#2365b4}.sender{font-weight:700;margin-right:7px}.content{white-space:pre-wrap}
</style></head><body><header id="connection-status" aria-label="Platform connection status"></header><main id="feed" aria-label="Combined live chat"></main><script src="/multichat.js" defer></script></body></html>
