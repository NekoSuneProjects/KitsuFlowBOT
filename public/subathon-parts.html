<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KitsuFlow Subathon Overlay</title><style>
*{box-sizing:border-box}body{margin:0;background:transparent;color:#fff;font:700 16px Inter,Arial,sans-serif}
.panel{margin:8px;padding:16px 20px;border-radius:16px;background:var(--background,#101c37);border:1px solid var(--accent,#4798ff);box-shadow:0 5px 23px #0005;width:max-content;min-width:260px;max-width:96vw}
#title{font-size:15px;letter-spacing:.15em;text-transform:uppercase;margin-bottom:8px}#clock{font-size:clamp(38px,7vw,100px);line-height:1.05;font-variant-numeric:tabular-nums;letter-spacing:.025em}#status{font-size:12px;margin-top:7px;opacity:.85}
#rewards{margin:8px 0 0;padding:0;list-style:none;min-width:255px;font-weight:500;font-size:14px}#rewards li{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:6px 3px;border-bottom:1px solid #ffffff25}#rewards strong{color:var(--accent,#4798ff);white-space:nowrap}#rewards .platform{font-size:11px;text-transform:uppercase;opacity:.72;margin-right:7px}.hidden{display:none!important}
body.compact .panel{border:0;border-radius:9px;padding:12px;background:linear-gradient(145deg,#064f9a,#07172d);min-width:235px}body.compact #clock{font-size:35px}body.compact #rewards{font-size:12px;min-width:230px}body.compact #rewards li{padding:3px}body.compact #status{display:none}
</style></head><body><main class="panel" id="panel"><div id="title">SUBATHON</div><div id="clock">00:00:00</div><div id="status">PAUSED</div><ul id="rewards"></ul></main><script>
'use strict';const parts=location.pathname.split('/'),mode=parts[parts.length-2],key=encodeURIComponent(parts[parts.length-1]),clock=document.getElementById('clock'),rewardList=document.getElementById('rewards');
document.body.classList.toggle('compact',mode==='compact');if(mode==='timer'){rewardList.classList.add('hidden')}if(mode==='info'){clock.classList.add('hidden');document.getElementById('status').classList.add('hidden')}
let current=null,fetched=Date.now();const format=ms=>{const n=Math.ceil(Math.max(0,ms)/1000);return [Math.floor(n/3600),Math.floor(n%3600/60),n%60].map(x=>String(x).padStart(2,'0')).join(':')};
function paint(){if(!current)return;const ms=current.remaining_ms-(current.running?Date.now()-fetched:0);clock.textContent=format(ms);document.getElementById('status').textContent=current.running&&ms>0?'● LIVE':'Ⅱ PAUSED'}
async function refresh(){try{const r=await fetch('/api/subathon/rewards/'+key,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);current=await r.json();fetched=Date.now();document.body.style.fontFamily=current.font+',Arial,sans-serif';document.body.style.color=current.text_color;const panel=document.getElementById('panel');panel.style.setProperty('--accent',current.accent);panel.style.setProperty('--background',current.background);if(mode!=='compact')panel.style.background=current.transparent?'transparent':current.background;document.getElementById('title').textContent=current.title;rewardList.replaceChildren();for(const rule of current.rules||[]){const li=document.createElement('li');const label=document.createElement('span'),seconds=document.createElement('strong');label.textContent=rule.platform.toUpperCase()+' · '+rule.event_type.replaceAll('_',' ')+(rule.per_unit?' / unit':'');seconds.textContent='+'+rule.seconds+'s';li.append(label,seconds);rewardList.append(li)}if(!rewardList.children.length&&mode!=='timer'){const li=document.createElement('li');li.textContent='No time rewards configured';rewardList.append(li)}paint()}catch(e){console.warn('Subathon overlay unavailable',e.message)}}
refresh();setInterval(refresh,2500);setInterval(paint,200);
</script></body></html>
