name: Build Voice Companion Desktop Apps
on:
  push:
    branches: [desktopapp]
    paths:
      - 'voice-companion/**'
      - '.github/workflows/voice-companion-build.yml'
  pull_request:
    paths:
      - 'voice-companion/**'
      - '.github/workflows/voice-companion-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    name: Build ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            label: Windows x64
            slug: windows-x64
            executable: KitsuFlowVoiceCompanion.exe
          - os: ubuntu-22.04
            label: Linux AMD64
            slug: linux-amd64
            executable: KitsuFlowVoiceCompanion
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install Linux GUI runtime and build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk libportaudio2 libasound2-dev
      - name: Install Python packaging requirements
        shell: bash
        run: |
          python -m pip install --upgrade pip pyinstaller
          python -m pip install -r voice-companion/requirements.txt
      - name: Compile native desktop executable
        shell: bash
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name KitsuFlowVoiceCompanion --collect-all vosk --collect-all sounddevice --collect-all faster_whisper --collect-all ctranslate2 --collect-all tokenizers --collect-all huggingface_hub voice-companion/companion.py
      - name: Prepare distribution
        shell: bash
        run: |
          mkdir -p "release/${{ matrix.slug }}"
          cp "dist/${{ matrix.executable }}" "release/${{ matrix.slug }}/"
          cp voice-companion/README.md "release/${{ matrix.slug }}/README.md"
          cp voice-companion/QUICKSTART.md "release/${{ matrix.slug }}/QUICKSTART.md"
          cp voice-companion/.env.example "release/${{ matrix.slug }}/.env.example"
      - name: Upload downloadable build
        uses: actions/upload-artifact@v4
        with:
          name: KitsuFlowVoiceCompanion-${{ matrix.slug }}
          path: release/${{ matrix.slug }}/
          retention-days: 30
          if-no-files-found: error

  release:
    name: Publish versioned GitHub Release
    needs: package
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/desktopapp'
    concurrency:
      group: desktopapp-release-publish
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Determine next patch version from published releases
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin desktopapp
          # Do not create a release for an obsolete build when a newer push exists.
          if [[ "$(git rev-parse origin/desktopapp)" != "$GITHUB_SHA" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "A newer desktopapp commit exists; its workflow will publish the release."
            exit 0
          fi
          # GitHub releases, not voice-companion/VERSION, are the source of truth.
          tags="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name')"
          best_major=0
          best_minor=0
          best_patch=0
          while IFS= read -r tag; do
            if [[ "$tag" =~ ^desktopapp-v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              major=$((10#${BASH_REMATCH[1]}))
              minor=$((10#${BASH_REMATCH[2]}))
              patch=$((10#${BASH_REMATCH[3]}))
              if (( major > best_major || (major == best_major && minor > best_minor) || (major == best_major && minor == best_minor && patch > best_patch) )); then
                best_major=$major
                best_minor=$minor
                best_patch=$patch
              fi
            fi
          done <<< "$tags"
          version="$best_major.$best_minor.$((best_patch + 1))"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=desktopapp-v$version" >> "$GITHUB_OUTPUT"
          echo "Next desktop version: $version"
      - uses: actions/download-artifact@v4
        if: steps.version.outputs.skip != 'true'
        with:
          pattern: KitsuFlowVoiceCompanion-*
          path: release-assets
      - name: Bundle versioned desktop downloads
        if: steps.version.outputs.skip != 'true'
        shell: bash
        run: |
          cd release-assets
          for platform in windows-x64 linux-amd64; do
            test -s "KitsuFlowVoiceCompanion-$platform/KitsuFlowVoiceCompanion$([[ "$platform" == windows-x64 ]] && echo '.exe' || true)"
            printf '%s\n' "${{ steps.version.outputs.version }}" > "KitsuFlowVoiceCompanion-$platform/VERSION"
            (cd "KitsuFlowVoiceCompanion-$platform" && zip -q -r "../KitsuFlowVoiceCompanion-${{ steps.version.outputs.tag }}-$platform.zip" .)
          done
          sha256sum KitsuFlowVoiceCompanion-*.zip > SHA256SUMS.txt
      - name: Publish GitHub Release with binaries
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          # Never overwrite a published release if a different workflow created it.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Re-run the workflow to recalculate a new version."
            exit 1
          fi
          gh release create "$TAG" release-assets/KitsuFlowVoiceCompanion-*.zip release-assets/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "KitsuFlow Voice Companion ${TAG#desktopapp-v}" \
            --generate-notes \
            --target "$GITHUB_SHA" \

