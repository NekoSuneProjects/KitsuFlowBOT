name: Studio checks
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JavaScript syntax (server, Studio modules, overlays)
        run: npm run check
      - name: Verify formatting
        run: npx --yes prettier@3 --check "server.js" "src/**/*.js" "public/**/*.{html,css,js}"
      - name: Verify voice worker syntax
        run: python3 -m py_compile voice-worker.py
      - name: Verify required Studio assets
        run: |
          test -s public/index.html
          test -s public/dashboard.html
          test -s public/css/studio.css
          test -s public/studio/main.js
