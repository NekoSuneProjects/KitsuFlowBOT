name: Studio frontend checks
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JavaScript syntax
        run: |
          node --check public/studio.js
          node --check platform-integrations.js
          node --check voice.js
          node --check creator-tools.js
          node --check public/multichat.js
          node --check voice-companion.js
          python3 -m py_compile voice-worker.py
      - name: Verify required Studio assets
        run: |
          test -s public/index.html
          test -s public/studio.css
          test -s public/studio.js
